<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PDF para Agenda</title>
    <meta name="description" content="Envie um PDF, confira as datas encontradas e crie os compromissos direto no seu Google Agenda. Grátis e sem cadastro." />
    <meta property="og:title" content="PDF para Agenda" />
    <meta property="og:description" content="Envie um PDF, confira as datas encontradas e crie os compromissos direto no seu Google Agenda." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131315" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='24' rx='4' fill='%23ffffff' stroke='%2317171a' stroke-width='2'/%3E%3Crect x='3' y='5' width='26' height='8' rx='3' fill='%23d2261b'/%3E%3Crect x='10' y='17' width='12' height='8' rx='1' fill='%2317171a'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('pdfagenda.tema'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
